{% load static i18n %}
<!doctype html>
<html lang="{{ LANGUAGE_CODE }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Kaado{% endblock %}</title><script>try{const saved=localStorage.getItem('kaado-theme');document.documentElement.dataset.theme=saved==='dark'||saved==='light'?saved:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){document.documentElement.dataset.theme='light'}</script><link rel="stylesheet" href="{% static 'flashcards/app.css' %}"></head>
<body><header class="site-header"><a class="brand" href="{% url 'deck_list' %}"><span class="brand-mark">K</span><span>kaado<span class="brand-dot">.</span></span></a><nav><a href="{% url 'deck_list' %}">{% trans "My decks" %}</a><form class="language-form" action="{% url 'set_language' %}" method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><label class="visually-hidden" for="language-select">{% trans "Interface language" %}</label><select id="language-select" name="language">{% for language_code, language_name in LANGUAGES %}<option value="{{ language_code }}"{% if language_code == LANGUAGE_CODE %} selected{% endif %}>{{ language_name }}</option>{% endfor %}</select></form><button class="theme-toggle" id="theme-toggle" type="button" aria-label="{% trans 'Switch to dark mode' %}" data-label-dark="{% trans 'Dark mode' %}" data-label-light="{% trans 'Light mode' %}" data-switch-dark="{% trans 'Switch to dark mode' %}" data-switch-light="{% trans 'Switch to light mode' %}"><span class="theme-icon" aria-hidden="true">☾</span><span class="theme-label">{% trans "Dark mode" %}</span></button></nav></header>
<main class="page-shell">{% block content %}{% endblock %}</main>
<script src="{% static 'flashcards/app.js' %}" defer></script></body></html>
