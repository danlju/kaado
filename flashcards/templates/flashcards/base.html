{% load static %}
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Kaado{% endblock %}</title><script>try{const saved=localStorage.getItem('kaado-theme');document.documentElement.dataset.theme=saved==='dark'||saved==='light'?saved:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){document.documentElement.dataset.theme='light'}</script><link rel="stylesheet" href="{% static 'flashcards/app.css' %}"></head>
<body><header class="site-header"><a class="brand" href="{% url 'deck_list' %}"><span class="brand-mark">K</span><span>kaado<span class="brand-dot">.</span></span></a><nav><a href="{% url 'deck_list' %}">My decks</a><button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode"><span class="theme-icon" aria-hidden="true">☾</span><span class="theme-label">Dark mode</span></button></nav></header>
<main class="page-shell">{% block content %}{% endblock %}</main><footer class="site-footer">A little practice, every day.</footer>
<script src="{% static 'flashcards/app.js' %}" defer></script></body></html>
